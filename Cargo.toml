[package]
name = "spectroscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Spectrum analyzer for multiple SDR platforms (Rust/egui rewrite of QSpectrumAnalyzer)"
license = "GPL-3.0-or-later"
repository = "https://github.com/konung-yaropolk/SpectroScope"
authors = ["SpectroScope contributors"]
build = "build.rs"

[lib]
name = "spectroscope"
# `cdylib` is what Android (cargo-apk / cargo-ndk) and wasm-bindgen link against.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "spectroscope"
path = "src/main.rs"

[dependencies]
# --- GUI ---------------------------------------------------------------------
# wgpu is the only renderer we enable; `eframe::wgpu` / `eframe::egui_wgpu`
# re-exports are used everywhere so the wgpu version can never drift.
#
# `default-features = false` drops eframe's `glow` renderer, which we do not
# want -- but it also drops the rest of eframe's defaults, so every one we still
# need is listed back explicitly. Two of those matter a great deal:
#   * `x11` and `wayland` are what make a Linux build able to open a window;
#   * eframe's default also carries `egui-wgpu?/default`, which is what enables
#     wgpu's platform backends. Without it wgpu compiles but panics at startup
#     with "No wgpu backend feature that is implemented for the target platform
#     was enabled", so the backends are selected per target further down.
#
# `accesskit` is deliberately missing from this list and added per-target
# further down: eframe refuses to compile it together with
# `android-native-activity`, because accesskit_winit's Android adapter only
# supports GameActivity. Everywhere else it is wanted, so it is switched on for
# everywhere else.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui = "0.32"
egui_plot = "0.33"

# --- data / infra ------------------------------------------------------------
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
log = "0.4"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
shell-words = "1"

# ---------------------------------------------------------------------------
# Native-only dependencies
# ---------------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }

# Just the PNG decoder: for the window icon, and for the colour-mapped
# waterfall export. eframe already pulls `image` in, so enabling one of its
# features costs nothing extra. TIFF is handled by fast-tiff-lib below, which
# can write the raw float data ImageJ wants.
image = { version = "0.25", default-features = false, features = ["png"] }

# ImageJ-compatible TIFF writing. `default-features = false` drops the memory
# map (we only write) and the ZSTD codec, whose C dependency is not worth
# pulling in for a Deflate-compressed file.
fast-tiff-lib = { version = "0.21", default-features = false }

# The native graphics backends. Cargo unifies features across the graph, so
# naming wgpu here is what gives eframe's own copy its backends. Each of these
# is inert on targets it does not apply to, so one list covers all three
# desktops; `gles` is the fallback for machines with no usable Vulkan/DX12.
wgpu = { version = "25", default-features = false, features = [
    "dx12",
    "gles",
    "metal",
    "vulkan",
    "wgsl",
] }


# ---------------------------------------------------------------------------
# Desktop-only dependencies
# ---------------------------------------------------------------------------
# Android is a `not(wasm32)` target too, which is why this table exists
# separately from the one above: `rfd` picks its backend by target_os and knows
# windows, macos, the BSDs, linux and wasm32 -- Android matches none of them, so
# its `backend` module compiles empty while `file_dialog.rs` still imports from
# it, and the build dies on a dozen unresolved names inside rfd. There is
# nothing to fix on our side and nothing to replace it with: a file chooser on
# Android is a Storage Access Framework intent, which needs JNI and an Activity,
# and the paths it hands back are content:// URIs rather than anything
# `File::create` would take. The two call sites return `None` there instead.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }

# Screen-reader support, everywhere it can be had. See the note on the main
# eframe dependency for why Android is left out rather than this being a
# feature of the base entry.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["accesskit"] }

# ---------------------------------------------------------------------------
# Web-only dependencies
# ---------------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web backends, for the same reason as the native ones above: without them
# egui-wgpu does not even compile for wasm32. WebGPU is preferred at runtime and
# WebGL is the fallback for browsers that lack it.
#
# `fragile-send-sync-non-atomic-wasm` is also part of what eframe's default
# features would have switched on: wasm32 without threads has no real `Send`, and
# wgpu's handles are only usable at all under that escape hatch.
wgpu = { version = "25", default-features = false, features = [
    "fragile-send-sync-non-atomic-wasm",
    "webgpu",
    "webgl",
    "wgsl",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "Document",
    "Element",
    "ErrorEvent",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "MessageEvent",
    "Url",
    "WebSocket",
    "Window",
]

# ---------------------------------------------------------------------------
# Android-only dependencies
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
# Must match the version winit 0.30 links, or there will be two AndroidApp types.
android-activity = { version = "0.6", features = ["native-activity"] }

# `EventLoopBuilderExtAndroid` -- the trait that hands the `AndroidApp` to the
# event loop -- lives in winit, and eframe does not re-export it: its `pub use`
# list is egui, emath, epaint, egui_glow, glow, egui_wgpu and wgpu, and nothing
# else. So winit is named directly. Same version eframe's own egui-winit pulls,
# so Cargo unifies them and there is only ever one event loop type.
winit = "0.30"

# Which android-activity backend winit builds against is a *feature* decision,
# and until it is made explicitly it rides on the android-activity dependency
# above happening to turn the right one on. Saying it here is what keeps the
# Android build correct if winit ever moves to android-activity 0.7, where that
# accidental unification would quietly stop.
eframe = { version = "0.32", default-features = false, features = [
    "android-native-activity",
] }

[dev-dependencies]
ron = "0.10"

# Host-side only: embeds the icon and version strings into the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"        # Enable Link-Time Optimization
codegen-units = 1  # Helps LTO optimize more effectively
strip = true       # Automatically strip symbols from the binary.
panic = 'unwind'   # 'abort' to kill process or 'unwind' for safe memory cleanup

# Keep the DSP fast even in debug builds, otherwise live sweeps crawl.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Smaller wasm bundles.
[profile.release-wasm]
inherits = "release"
opt-level = "s"
panic = "abort"

# ---------------------------------------------------------------------------
# Web packaging (wasm-pack)
# ---------------------------------------------------------------------------
# wasm-pack ships wasm-opt 117, which refuses to even parse the bulk-memory
# and sign-extension instructions rustc now emits unless each proposal is
# named. Without these flags the release build dies on "error validating
# input" and the only advice on offer is to turn the optimiser off.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-multivalue",
]

# ---------------------------------------------------------------------------
# Debian / Ubuntu packaging (cargo-deb)
# ---------------------------------------------------------------------------
# Used by the build-linux-deb job in .github/workflows/release.yml. One crate,
# so every path below is relative to this manifest's directory, which is also
# the repository root. Output: target/debian/spectroscope_<version>-1_<arch>.deb
[package.metadata.deb]
maintainer = "konung_yaropolk"
section = "hamradio"
priority = "optional"
extended-description = """\
A spectrum analyzer front end for software defined radios: a GPU waterfall \
over a spectrum plot, peak hold, averaging, smoothing, persistence and \
baseline subtraction. Drives soapy_power, hackrf_sweep, rtl_power, \
rtl_power_fftw and rx_power, and has its own rtl_tcp client that needs no \
helper binary at all."""
# `$auto` reads the binary's own NEEDED list, which here is little more than
# libc: everything that makes a window is reached through dlopen, so none of it
# shows up in the ELF and all of it has to be named by hand.
#   * X11 and xkbcommon come from winit, and EGL/GL from wgpu's GLES backend,
#     which is the fallback that always works.
#   * Vulkan is wgpu's first choice but only a Recommends: the app runs on GLES
#     without it, and requiring a Vulkan ICD would make the package
#     uninstallable on machines where it would have worked.
#   * Wayland likewise -- an X11-only session is still a session.
depends = "$auto, libx11-6, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libegl1, libgl1"
recommends = "libvulkan1, mesa-vulkan-drivers, libwayland-client0"
# The helper-process backends. Every one of them is optional: `rtl_tcp` and
# `demo` are built in and need nothing installed, so a package that pulled in
# the whole SoapySDR stack would be charging every user for a backend most of
# them will not pick.
suggests = "soapysdr-tools, rtl-sdr, hackrf"
# Listing assets disables cargo-deb's automatic binary inclusion, so the binary
# is listed here too. The .desktop entry and the hicolor icons give the app a
# menu launcher; dpkg refreshes the icon and desktop caches on install.
assets = [
    ["target/release/spectroscope", "usr/bin/spectroscope", "755"],
    ["packaging/spectroscope.desktop", "usr/share/applications/spectroscope.desktop", "644"],
    ["icon/icon16.png", "usr/share/icons/hicolor/16x16/apps/spectroscope.png", "644"],
    ["icon/icon32.png", "usr/share/icons/hicolor/32x32/apps/spectroscope.png", "644"],
    ["icon/icon48.png", "usr/share/icons/hicolor/48x48/apps/spectroscope.png", "644"],
    ["icon/icon64.png", "usr/share/icons/hicolor/64x64/apps/spectroscope.png", "644"],
    ["icon/icon128.png", "usr/share/icons/hicolor/128x128/apps/spectroscope.png", "644"],
    ["icon/icon256.png", "usr/share/icons/hicolor/256x256/apps/spectroscope.png", "644"],
    ["README.md", "usr/share/doc/spectroscope/README.md", "644"],
]

# ---------------------------------------------------------------------------
# Fedora / RHEL / openSUSE packaging (cargo-generate-rpm)
# ---------------------------------------------------------------------------
# The RPM counterpart to [package.metadata.deb], used by the build-linux-rpm
# job. cargo-generate-rpm is pure Rust -- no rpmbuild -- so the RPM is built on
# the same Ubuntu runner as the .deb. That means it links the runner's glibc,
# so it targets *recent* RPM distros: the same portability envelope as the .deb.
#
# Output: target/generate-rpm/spectroscope-<version>-1.<arch>.rpm, with the arch
# read from the binary so the two runners in the matrix cannot collide.
[package.metadata.generate-rpm]
# `builtin`: scan the ELF's NEEDED sonames and emit `libfoo.so.N()(64bit)`
# Requires, which every RPM distro resolves through its own package Provides --
# more portable than hard-coding Fedora vs openSUSE package names, and it works
# on a non-RPM build host where the usual find-requires helper is absent.
#
# Deliberately *not* mirroring the .deb's hand-written depends list: those are
# dlopened libraries, and an RPM Requires naming them would have to carry the
# `()(64bit)` arch suffix, which differs between the two architectures this is
# built for and would therefore be wrong on one of them. Every RPM desktop
# ships X11, Mesa and xkbcommon regardless; the README says what is needed.
auto-req = "builtin"
assets = [
    { source = "target/release/spectroscope", dest = "/usr/bin/spectroscope", mode = "755" },
    { source = "packaging/spectroscope.desktop", dest = "/usr/share/applications/spectroscope.desktop", mode = "644" },
    { source = "icon/icon16.png", dest = "/usr/share/icons/hicolor/16x16/apps/spectroscope.png", mode = "644" },
    { source = "icon/icon32.png", dest = "/usr/share/icons/hicolor/32x32/apps/spectroscope.png", mode = "644" },
    { source = "icon/icon48.png", dest = "/usr/share/icons/hicolor/48x48/apps/spectroscope.png", mode = "644" },
    { source = "icon/icon64.png", dest = "/usr/share/icons/hicolor/64x64/apps/spectroscope.png", mode = "644" },
    { source = "icon/icon128.png", dest = "/usr/share/icons/hicolor/128x128/apps/spectroscope.png", mode = "644" },
    { source = "icon/icon256.png", dest = "/usr/share/icons/hicolor/256x256/apps/spectroscope.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/spectroscope/README.md", mode = "644" },
]

# ---------------------------------------------------------------------------
# Android packaging (cargo-apk)
# ---------------------------------------------------------------------------
[package.metadata.android]
package = "cz.eutopia.spectroscope"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
apk_name = "SpectroScope"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = false

[package.metadata.android.application]
label = "SpectroScope"

# ---------------------------------------------------------------------------
# Windows packaging
# ---------------------------------------------------------------------------
[package.metadata.winres]
OriginalFilename = "SpectroScope"
LegalCopyright = "konung_yaropolk © 2026"
FileDescription = "SpectroScope"
ProductName = "SpectroScope"
